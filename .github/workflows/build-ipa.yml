
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Xcode project
        id: locate
        run: |
          PROJECT=$(find source -maxdepth 5 -name '*.xcodeproj' -print -quit 2>/dev/null || true)
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find . -maxdepth 5 -name '*.xcodeproj' -print -quit)
          fi
          if [ -z "$PROJECT" ]; then
            echo "No Xcode project found"
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Build IPA
        run: |
          xcodebuild \
            -project "${{ steps.locate.outputs.project }}" \
            -scheme 3106 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/3106.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry 3106-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3106-IPA
          path: 3106-unsigned.ipa
          if-no-files-found: error
